<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Leave a message on DK's guestbook">
  <title>Guestbook - DK Blog Place</title>
  <link rel="icon" href="/assets/img/avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="nav-left">
        <img src="/assets/img/avatar.jpg" alt="DK" class="nav-avatar">
        <a href="/" class="nav-title">DK Blog Place</a>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <a href="/about.html">About</a>
        <a href="/guestbook.html">Guestbook</a>
        <a href="/contact.html">Contact</a>
        <a href="/search.html">Search</a>
        <a href="/login.html">Login</a>
      </div>
      <div class="nav-controls">
        <button class="nav-btn lang-btn" onclick="window.location.href='/zh-cn/guestbook.html'">中</button>
        <button class="nav-btn" id="theme-toggle">☀</button>
        <button class="hamburger" id="hamburger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      <div class="guestbook-page">
        <div class="guestbook-hero">
          <div class="guestbook-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="40" height="40">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h1 class="guestbook-title">Guestbook</h1>
          <p class="guestbook-subtitle">Leave a message, share your thoughts, or just say hi!</p>
        </div>
        <div class="guestbook-notice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span>Comments are powered by GitHub Issues. You'll need a GitHub account to leave a message. It'll be slow sometimes when loading contents, please wait.</span>
        </div>
        <div id="comments">
          <script src="https://utteranc.es/client.js"
            repo="GiuseppeLR/web"
            issue-term="pathname"
            label="guestbook"
            theme="preferred-color-scheme"
            crossorigin="anonymous"
            async>
          </script>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 DKa1pha.</p>
  </footer>
  <script src="/assets/js/main.js?v=4"></script>
</body>
</html>
