<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Blog posts">
  <title>Blog - DK Blog Place</title>
  <link rel="icon" href="/assets/img/avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/assets/css/style.css?v=5">
  <script src="/assets/js/supabase.min.js"></script>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="nav-left">
        <img src="/assets/img/avatar.jpg" alt="DK" class="nav-avatar">
        <a href="/" class="nav-title">DK Blog Place</a>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <a href="/about.html">About</a>
        <a href="/guestbook.html">Guestbook</a>
        <a href="/contact.html">Contact</a>
        <a href="/search.html">Search</a>
        <a href="/login.html">Login</a>
      </div>
      <div class="nav-controls">
        <button class="nav-btn lang-btn" onclick="window.location.href='/zh-cn/blog/'">中</button>
        <button class="nav-btn" id="theme-toggle">☀</button>
        <button class="hamburger" id="hamburger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      <h1 class="page-title">Blog</h1>
      <div id="blog-loading" class="loading">
        <div class="spinner"></div>
        <p>Loading posts...</p>
      </div>
      <section class="blog-cards" id="blog-cards" style="display: none;"></section>
      <div id="blog-empty" class="empty-state" style="display: none;">No posts yet. Check back soon!</div>
      <div id="blog-error" class="error-state" style="display: none;">Failed to load posts. Please try again later.</div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 DKa1pha. <a href="/privacy.html" style="color: var(--text-secondary);">Privacy Policy</a></p>
  </footer>
  <script src="/assets/js/auth.js?v=2"></script>
  <script src="/assets/js/main.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loading = document.getElementById('blog-loading');
      const cardsContainer = document.getElementById('blog-cards');
      const empty = document.getElementById('blog-empty');
      const errorEl = document.getElementById('blog-error');

      try {
        const { data, error } = await supabaseClient
          .from('blog_posts')
          .select('id, title, slug, excerpt, tags, published_at, created_at')
          .eq('published', true)
          .eq('lang', 'en')
          .order('published_at', { ascending: false });

        if (error) throw error;

        loading.style.display = 'none';

        if (!data || data.length === 0) {
          empty.style.display = 'block';
          return;
        }

        cardsContainer.style.display = 'flex';
        cardsContainer.innerHTML = data.map(post => {
          const date = post.published_at || post.created_at;
          const tagsHtml = (post.tags || [])
            .map(t => `<span class="tag">${escapeHtml(t)}</span>`)
            .join('');
          return `
            <article class="blog-card">
              <div class="card-body">
                <h3 class="card-title">
                  <a href="/blog/post.html?slug=${encodeURIComponent(post.slug)}">${escapeHtml(post.title)}</a>
                </h3>
                <p class="card-date">${formatDate(date)}</p>
                <div class="card-tags">${tagsHtml}</div>
                <p class="card-excerpt">${escapeHtml(post.excerpt || '')}</p>
                <a href="/blog/post.html?slug=${encodeURIComponent(post.slug)}" class="card-link">Read More &rarr;</a>
              </div>
            </article>
          `;
        }).join('');
      } catch (err) {
        console.error('Error loading blog posts:', err);
        loading.style.display = 'none';
        errorEl.style.display = 'block';
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      return new Date(dateStr).toLocaleDateString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric'
      });
    }
  </script>
</body>
</html>
