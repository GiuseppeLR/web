<!DOCTYPE html>
<html lang="zh-cn" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在 DK Blog Place 搜索博客文章">
  <title>搜索 - DK Blog Place</title>
  <link rel="icon" href="/assets/img/avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="nav-left">
        <img src="/assets/img/avatar.jpg" alt="DK" class="nav-avatar">
        <a href="/zh-cn/" class="nav-title">DK Blog Place</a>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="/zh-cn/">主页</a>
        <a href="/zh-cn/blog/">博客</a>
        <a href="/zh-cn/about.html">关于</a>
        <a href="/zh-cn/guestbook.html">留言板</a>
        <a href="/zh-cn/contact.html">联系</a>
        <a href="/zh-cn/search.html">搜索</a>
        <a href="/zh-cn/login.html">登录</a>
      </div>
      <div class="nav-controls">
        <button class="nav-btn lang-btn" onclick="window.location.href='/'">EN</button>
        <button class="nav-btn" id="theme-toggle">☀</button>
        <button class="hamburger" id="hamburger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      <div class="search-page">
        <div class="search-hero">
          <div class="search-icon-large">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
          <h1 class="search-title">搜索</h1>
          <p class="search-subtitle">查找文章、项目等内容</p>
        </div>
        <div class="search-box-wrapper">
          <svg class="search-box-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-box" class="search-input" placeholder="输入关键词搜索..." autocomplete="off">
          <button class="search-clear" id="search-clear" aria-label="清除搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div id="search-results" class="search-results"></div>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 DKa1pha.</p>
  </footer>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/search.js"></script>
</body>
</html>
