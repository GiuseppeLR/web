  <title>留言板 - DK Blog Place</title>
  <link rel="icon" href="/assets/img/avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/assets/css/style.css?v=3">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="nav-left">
        <img src="/assets/img/avatar.jpg" alt="DK" class="nav-avatar">
        <a href="/zh-cn/" class="nav-title">DK Blog Place</a>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="/zh-cn/">主页</a>
        <a href="/zh-cn/blog/">博客</a>
        <a href="/zh-cn/about.html">关于</a>
        <a href="/zh-cn/guestbook.html">留言板</a>
        <a href="/zh-cn/contact.html">联系</a>
        <a href="/zh-cn/search.html">搜索</a>
        <a href="/zh-cn/login.html">登录</a>
      </div>
      <div class="nav-controls">
        <button class="nav-btn lang-btn" onclick="window.location.href='/guestbook.html'">EN</button>
        <button class="nav-btn" id="theme-toggle">☀</button>
        <button class="hamburger" id="hamburger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      <div class="guestbook-page">
        <div class="guestbook-hero">
          <div class="guestbook-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="40" height="40">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h1 class="guestbook-title">留言板</h1>
          <p class="guestbook-subtitle">留下你想说的话，分享你的想法，或只是打个招呼！</p>
        </div>
        <div class="guestbook-notice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span>评论由 GitHub Issues 驱动，需要 GitHub 账号才能留言。加载会有点缓慢，请耐心等待加载。</span>
        </div>
        <div id="comments">
          <script src="https://utteranc.es/client.js"
            repo="GiuseppeLR/web"
            issue-term="pathname"
            label="guestbook"
            theme="preferred-color-scheme"
            crossorigin="anonymous"
            async>
          </script>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 DKa1pha.</p>
  </footer>
  <script src="/assets/js/main.js?v=3"></script>
