</head>

        <a href="/zh-cn/about.html">关于</a>

        <button class="hamburger" id="hamburger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      <div class="auth-page">
        <div class="auth-card">
          <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
          </div>
          <h1 class="auth-title">创建账号</h1>
          <p class="auth-subtitle">几秒钟加入 DK Blog Place</p>

          <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab active" data-tab="phone" role="tab">手机号</button>
            <button type="button" class="auth-tab" data-tab="email" role="tab">邮箱</button>
          </div>

          <!-- 手机号注册 -->
          <div class="auth-tab-pane active" id="pane-phone">
            <form class="auth-form" data-form="phone" onsubmit="return false">
              <div>
                <label class="auth-label" for="nickname-phone">昵称</label>
                <div class="auth-input-wrap">
                  <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                  </svg>
                  <input type="text" id="nickname-phone" class="auth-input" placeholder="我们该怎么称呼你？" autocomplete="nickname">
                </div>
              </div>
              <div>
                <label class="auth-label">手机号</label>
                <div class="phone-input-row">
                  <select class="phone-code-select" id="phone-code"></select>
                  <div class="auth-input-wrap" style="flex:1">
                    <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>
                    </svg>
                    <input type="tel" id="phone-number" class="auth-input" placeholder="手机号码" autocomplete="tel" inputmode="numeric">
                  </div>
                </div>
              </div>
              <div>
                <label class="auth-label" for="otp-code">验证码</label>
                <div class="otp-row">
                  <input type="text" id="otp-code" class="otp-input" placeholder="6位验证码" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
                  <button type="button" class="otp-send-btn" id="otp-send">获取验证码</button>
                </div>
                <p class="phone-hint">验证码将发送至你的手机，验证成功后自动创建账号并登录。</p>
              </div>
              <button type="submit" class="auth-btn" id="phone-submit">获取验证码并注册</button>
            </form>
          </div>

          <!-- 邮箱注册 -->
          <div class="auth-tab-pane" id="pane-email">
            <form class="auth-form" data-form="email" onsubmit="return false">
              <div>
                <label class="auth-label" for="nickname">昵称</label>
                <div class="auth-input-wrap">
                  <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                  </svg>
                  <input type="text" id="nickname" class="auth-input" placeholder="我们该怎么称呼你？" autocomplete="nickname">
                </div>
              </div>
              <div>
                <label class="auth-label" for="email">邮箱</label>
                <div class="auth-input-wrap">
                  <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                  </svg>
                  <input type="email" id="email" class="auth-input" placeholder="you@example.com" autocomplete="email" required>
                </div>
              </div>
              <div>
                <label class="auth-label" for="password">密码</label>
                <div class="auth-input-wrap">
                  <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                  <input type="password" id="password" class="auth-input auth-password" placeholder="至少 8 位字符" autocomplete="new-password" required>
                  <button type="button" class="auth-toggle" aria-label="显示密码">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                  </button>
                </div>
              </div>
              <div>
                <label class="auth-label" for="confirm-password">确认密码</label>
                <div class="auth-input-wrap">
                  <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                  <input type="password" id="confirm-password" class="auth-input auth-password" placeholder="再次输入密码" autocomplete="new-password" required>
                  <button type="button" class="auth-toggle" aria-label="显示密码">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                  </button>
                </div>
              </div>
              <button type="submit" class="auth-btn">创建账号</button>
            </form>
          </div>

          <div class="auth-divider"><span>或使用以下方式注册</span></div>

          <div class="auth-social">
            <button type="button" class="auth-social-btn" aria-label="Facebook">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span>Facebook</span>
            </button>
            <button type="button" class="auth-social-btn" aria-label="GitHub">
              <svg viewBox="0 0 496 512" fill="currentColor">
                <path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.6 3-.3 5.6 1.3 5.6 3.6zm-31.1-4.5c-.7 2 1.3 4.3 4.3 4.9 2.6 1 5.6 0 6.2-2s-1.3-4.3-4.3-5.2c-2.6-.7-5.5.3-6.2 2.3zm44.2-1.7c-2.9.7-4.9 2.6-4.6 4.9.3 2 2.9 3.3 5.9 2.6 2.9-.7 4.9-2.6 4.6-4.6-.3-1.9-3-3.2-5.9-2.9zM244.8 8C106.1 8 0 113.3 0 252c0 110.9 69.8 205.8 169.5 239.2 12.8 2.3 17.3-5.6 17.3-12.1 0-6.2-.3-40.4-.3-61.4 0 0-70 15-84.7-29.8 0 0-11.4-29.1-27.8-36.6 0 0-22.9-15.7 1.6-15.4 0 0 24.9 2 38.6 25.8 21.9 38.6 58.6 27.5 72.9 20.9 2.3-16.3 8.6-27.5 15.7-33.7-55.1-6.2-112.3-14.3-112.3-110.5 0-27.5 7.6-41.3 23.6-58.9-2.6-6.5-11.1-33.3 2.6-67.9 20.9-6.5 69 27 69 27 20-5.6 41.5-8.5 62.8-8.5s42.8 2.9 62.8 8.5c0 0 48.1-33.6 69-27 13.7 34.7 5.2 61.4 2.6 67.9 16 17.7 25.8 31.5 25.8 58.9 0 96.5-58.9 104.2-114 110.5 9.2 7.9 17 22.9 17 46.4 0 33.7-.3 75.4-.3 83.6 0 6.5 4.6 14.4 17.3 12.1C428.2 457.8 496 362.9 496 252 496 113.3 383.5 8 244.8 8zM97.2 352.8c-1.3 1-1 3.3.7 5.2 1.6 1.6 3.9 2.3 5.2 1 1.3-1 1-3.3-.7-5.2-1.6-1.6-3.9-2.3-5.2-1zm-10.8-8.1c-.7 1.3.3 2.9 2.3 3.9 1.6 1 3.6.7 4.3-.7.7-1.3-.3-2.9-2.3-3.9-2-.6-3.6-.3-4.3.7zm32.4 35.6c-1.6 1.3-1 4.3 1.3 6.2 2.3 2.3 5.2 2.6 6.5 1 1.3-1.3.7-4.3-1.3-6.2-2.2-2.3-5.2-2.6-6.5-1zm-11.4-14.7c-1.6 1-1.6 3.6 0 5.9 1.6 2.3 4.3 3.3 5.6 2.3 1.6-1.3 1.6-3.9 0-6.2-1.4-2.3-4-3.3-5.6-2z"/>
              </svg>
              <span>GitHub</span>
            </button>
            <button type="button" class="auth-social-btn" aria-label="谷歌">
              <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              <span>谷歌</span>
            </button>
          </div>

          <p class="auth-footer">已有账号？<a href="/zh-cn/login.html">去登录</a></p>
        </div>
      </div>
    </div>
  </main>
  <footer>

  </footer>
  <script src="/assets/js/main.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/auth-phone.js"></script>
  <script>
    (function() {
      'use strict';

      // ── 注册成功后显示通行密钥设置 ──
      function showPasskeySetup() {
        const card = document.querySelector('.auth-card');
        const iconHTML = card.querySelector('.auth-icon').outerHTML;
        card.innerHTML =
          iconHTML +
          '<h1 class="auth-title">账号创建成功！</h1>' +
          '<p class="auth-subtitle">设置通行密钥，下次可用触控 ID 或面容 ID 快速登录。</p>' +
          '<button type="button" class="auth-btn" id="pk-setup-btn">设置通行密钥</button>' +
          '<button type="button" class="auth-btn" id="pk-skip-btn" style="margin-top:8px;opacity:0.7">以后再说</button>' +
          '<p class="auth-footer"><a href="/zh-cn/">返回首页</a></p>';
        document.getElementById('pk-setup-btn').addEventListener('click', async () => {
          const btn = document.getElementById('pk-setup-btn');
          btn.disabled = true;
          btn.textContent = '设置中...';
          try {
            const { error } = await supabaseClient.auth.registerPasskey();
            if (error) throw error;
            alert('通行密钥已注册！现在可以使用触控 ID / 面容 ID 登录。');
            window.location.href = '/zh-cn/';
          } catch (err) {
            alert(err.message || '通行密钥设置失败，可稍后在登录页设置。');
            btn.disabled = false;
            btn.textContent = '设置通行密钥';
          }
        });
        document.getElementById('pk-skip-btn').addEventListener('click', () => {
          window.location.href = '/zh-cn/';
        });
      }

      // ── Tab switching (phone / email) ──
      const tabs = document.querySelectorAll('.auth-tab');
      const panes = document.querySelectorAll('.auth-tab-pane');
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          panes.forEach(p => p.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('pane-' + tab.dataset.tab).classList.add('active');
        });
      });

      // ── Populate country codes ──
      populateCountryCodes(document.getElementById('phone-code'), '+86');

      // ── Phone signup (OTP) ──
      const phoneForm = document.querySelector('form[data-form="phone"]');
      const phoneNumber = document.getElementById('phone-number');
      const phoneCode = document.getElementById('phone-code');
      const otpCode = document.getElementById('otp-code');
      const otpSendBtn = document.getElementById('otp-send');
      const phoneSubmitBtn = document.getElementById('phone-submit');
      let pendingPhone = null; // stores full phone number waiting for OTP

      // Send OTP
      otpSendBtn.addEventListener('click', async () => {
        const phone = phoneCode.value + phoneNumber.value.trim();
        if (!phoneNumber.value.trim()) { alert('请输入手机号码。'); return; }
        otpSendBtn.disabled = true;
        try {
          const { error } = await supabaseClient.auth.signInWithOtp({ phone });
          if (error) throw error;
          pendingPhone = phone;
          alert('验证码已发送！请查收手机短信。');
          startOtpCountdown(otpSendBtn, 60);
        } catch (err) {
          alert(err.message);
          otpSendBtn.disabled = false;
        }
      });

      // Verify OTP (registers + signs in)
      phoneForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = otpCode.value.trim();
        if (!code || code.length !== 6) { alert('请输入 6 位验证码。'); return; }
        if (!pendingPhone) { alert('请先获取验证码。'); return; }
        phoneSubmitBtn.disabled = true;
        phoneSubmitBtn.textContent = '验证中...';
        try {
          const { data, error } = await supabaseClient.auth.verifyOtp({
            phone: pendingPhone,
            token: code,
            type: 'sms'
          });
          if (error) throw error;
          // Optionally store nickname into user metadata
          const nickname = document.getElementById('nickname-phone').value.trim();
          if (nickname && data.session) {
            await supabaseClient.auth.updateUser({ data: { nickname, username: nickname } });
          }
          showPasskeySetup();
        } catch (err) {
          alert(err.message);
          phoneSubmitBtn.disabled = false;
          phoneSubmitBtn.textContent = '获取验证码并注册';
        }
      });

      // ── Email signup ──
      const emailForm = document.querySelector('form[data-form="email"]');
      const emailSubmitBtn = emailForm.querySelector('.auth-btn');
      emailForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const nickname = document.getElementById('nickname').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm-password').value;

        if (password.length < 8) { alert('密码至少需要 8 位字符。'); return; }
        if (password !== confirm) { alert('两次输入的密码不一致。'); return; }

        emailSubmitBtn.disabled = true;
        emailSubmitBtn.textContent = '创建中...';
        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { nickname, username: nickname }
            }
          });
          if (error) throw error;
          if (data.session) {
            // 邮箱验证已关闭，直接登录成功
            showPasskeySetup();
          } else {
            // 需要邮箱验证
            alert('注册成功！请查收邮箱确认邮件。');
            emailSubmitBtn.disabled = false;
            emailSubmitBtn.textContent = '创建账号';
          }
        } catch (err) {
          alert(err.message);
          emailSubmitBtn.disabled = false;
          emailSubmitBtn.textContent = '创建账号';
        }
      });

      // ── 第三方注册 ──
      document.querySelectorAll('.auth-social-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const label = (btn.getAttribute('aria-label') || '').toLowerCase();
          try {
            if (label === 'github') {
              sessionStorage.setItem('redirectAfterLogin', '/zh-cn/');
              const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'github',
                options: { redirectTo: window.location.origin + '/zh-cn/' }
              });
              if (error) throw error;
              return;
            }
            const provider = label === 'google' || label === '谷歌' ? 'google' : 'facebook';
            sessionStorage.setItem('redirectAfterLogin', '/zh-cn/');
            const { error } = await supabaseClient.auth.signInWithOAuth({
              provider,
              options: { redirectTo: window.location.origin + '/zh-cn/' }
            });
            if (error) throw error;
          } catch (err) {
            alert(err.message);
          }
        });
      });
    })();
  </script>
</body>
