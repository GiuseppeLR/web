<!DOCTYPE html>
<html lang="zh-cn" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="重置 DK Blog Place 密码">
  <title>忘记密码 - DK Blog Place</title>
  <link rel="icon" href="/assets/img/avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/assets/css/style.css?v=3">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="nav-left">
        <img src="/assets/img/avatar.jpg" alt="DK" class="nav-avatar">
        <a href="/zh-cn/" class="nav-title">DK Blog Place</a>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="/zh-cn/">主页</a>
        <a href="/zh-cn/blog/">博客</a>
        <a href="/zh-cn/about.html">关于</a>
        <a href="/zh-cn/guestbook.html">留言板</a>
        <a href="/zh-cn/contact.html">联系</a>
        <a href="/zh-cn/search.html">搜索</a>
        <a href="/zh-cn/login.html" class="active">登录</a>
      </div>
      <div class="nav-controls">
        <button class="nav-btn lang-btn" onclick="window.location.href='/forgot-password.html'">EN</button>
        <button class="nav-btn" id="theme-toggle">☀</button>
        <button class="hamburger" id="hamburger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      <div class="auth-page">
        <a href="/zh-cn/login.html" class="auth-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          返回登录
        </a>
        <div class="auth-card">
          <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 3l-9 9"/><path d="M15 3h6v6"/>
            </svg>
          </div>
          <h1 class="auth-title">忘记密码？</h1>
          <p class="auth-subtitle">输入你的邮箱，我们会发送重置链接给你</p>

          <form class="auth-form" onsubmit="return false">
            <div>
              <label class="auth-label" for="email">邮箱</label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                </svg>
                <input type="email" id="email" class="auth-input" placeholder="you@example.com" autocomplete="email" required>
              </div>
            </div>
            <button type="submit" class="auth-btn">发送重置链接</button>
          </form>

          <p class="auth-footer">想起来了？<a href="/zh-cn/login.html">去登录</a></p>
        </div>
        <p class="auth-note">当前为界面原型，尚未接入真实认证系统。</p>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 DKa1pha.</p>
  </footer>
  <script src="/assets/js/main.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    (function() {
      'use strict';
      const form = document.querySelector('.auth-form');
      const submitBtn = form.querySelector('.auth-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) { alert('请输入你的邮箱。'); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = '发送中...';
        try {
          const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/zh-cn/update-password.html'
          });
          if (error) throw error;
          alert('重置链接已发送！请查收邮箱。');
          submitBtn.disabled = false;
          submitBtn.textContent = '发送重置链接';
          form.reset();
        } catch (err) {
          alert(err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = '发送重置链接';
        }
      });
    })();
  </script>
</body>
</html>
