  <script src="/assets/js/supabase.min.js"></script>
  <script src="/assets/js/auth.js?v=2"></script>
  <script src="/assets/js/main.js?v=4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const loading = document.getElementById('home-loading');
      const container = document.getElementById('home-posts');

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
      }
      function formatDate(dateStr) {
        if (!dateStr) return '';
        var d = new Date(dateStr);
        return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
      }

      try {
        const { data, error } = await supabaseClient
          .from('blog_posts')
          .select('id, title, slug, excerpt, tags, published_at, created_at')
          .eq('published', true)
          .eq('lang', 'zh')
          .order('published_at', { ascending: false })
          .limit(2);

        if (error) throw error;

        if (!data || data.length === 0) {
          loading.innerHTML = '<p>暂无文章，敬请期待！</p>';
          return;
        }

        loading.style.display = 'none';
        container.style.display = 'block';
        container.innerHTML = data.map(post => {
          const date = post.published_at || post.created_at;
          const tagsHtml = (post.tags || []).map(t => '<span class="tag">' + escapeHtml(t) + '</span>').join('');
          const url = '/zh-cn/blog/post.html?slug=' + encodeURIComponent(post.slug);
          return '<div class="blog-card"><a href="' + url + '" class="blog-card-link">' +
            '<h3>' + escapeHtml(post.title) + '</h3>' +
            '<p class="blog-card-meta">' + formatDate(date) + ' &middot; ' + tagsHtml + '</p>' +
            '<p class="blog-card-excerpt">' + escapeHtml(post.excerpt || '') + '</p>' +
          '</a></div>';
        }).join('');
      } catch (err) {
        console.error('Failed to load latest posts:', err);
        loading.innerHTML = '<p>加载失败。<a href="/zh-cn/blog/">访问博客</a></p>';
      }
    });
  </script>
</body>
