<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to DK Blog Place">
  <title>Sign In - DK Blog Place</title>
  <link rel="icon" href="/assets/img/avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="nav-left">
        <img src="/assets/img/avatar.jpg" alt="DK" class="nav-avatar">
        <a href="/" class="nav-title">DK Blog Place</a>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <a href="/about.html">About</a>
        <a href="/guestbook.html">Guestbook</a>
        <a href="/contact.html">Contact</a>
        <a href="/search.html">Search</a>
        <a href="/login.html" class="active">Login</a>
      </div>
      <div class="nav-controls">
        <button class="nav-btn lang-btn" onclick="window.location.href='/zh-cn/login.html'">中</button>
        <button class="nav-btn" id="theme-toggle">☀</button>
        <button class="hamburger" id="hamburger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      <div class="auth-page">
        <div class="auth-card">
          <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to your account to continue</p>

          <form class="auth-form" onsubmit="return false">
            <div>
              <label class="auth-label" for="email">Email</label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                </svg>
                <input type="email" id="email" class="auth-input" placeholder="you@example.com" autocomplete="email" required>
              </div>
            </div>
            <div>
              <label class="auth-label" for="password">Password</label>
              <div class="auth-input-wrap">
                <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="password" class="auth-input auth-password" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="auth-toggle" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="auth-row">
              <label class="auth-check"><input type="checkbox"> Remember me</label>
              <a href="/forgot-password.html" class="auth-link">Forgot password?</a>
            </div>
            <button type="submit" class="auth-btn">Sign In</button>
          </form>

          <div class="auth-divider"><span>or continue with</span></div>

          <div class="auth-social">
            <button type="button" class="auth-social-btn" aria-label="Apple">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.03 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
              </svg>
              <span>Apple</span>
            </button>
            <button type="button" class="auth-social-btn" aria-label="Passkey">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/>
              </svg>
              <span>Passkey</span>
            </button>
            <button type="button" class="auth-social-btn" aria-label="WeChat">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.325.325 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .718-.098 11.278 11.278 0 0 0 2.836.373h.002c.295 0 .58-.021.864-.05-1.204-1.604-1.846-3.481-1.846-5.386 0-3.166 2.532-5.74 5.659-5.74.238 0 .474.015.707.043C13.105 4.105 11.08 2.188 8.69 2.188zm8.895 4.323c-3.51 0-6.354 2.41-6.354 5.384s2.845 5.383 6.354 5.383c.683 0 1.347-.094 1.974-.264a.57.57 0 0 1 .474.065l1.398.818a.216.216 0 0 0 .297-.078.212.212 0 0 0 .032-.112c0-.049-.022-.099-.034-.148l-.344-1.305a.412.412 0 0 1 .149-.465c1.187-.867 1.953-2.22 1.953-3.73 0-2.973-2.845-5.383-6.355-5.383zM5.542 7.508a.944.944 0 1 1 0 1.889.944.944 0 0 1 0-1.889zm6.29 0a.944.944 0 1 1 0 1.889.944.944 0 0 1 0-1.889zm6.285 3.887a.811.811 0 1 1 0 1.622.811.811 0 0 1 0-1.622zm-6.29 0a.811.811 0 1 1 0 1.622.811.811 0 0 1 0-1.622z"/>
              </svg>
              <span>WeChat</span>
            </button>
            <button type="button" class="auth-social-btn" aria-label="Google">
              <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              <span>Google</span>
            </button>
          </div>

          <p class="auth-footer">Don't have an account? <a href="/register.html">Sign up</a></p>
        </div>
        <p class="auth-note">This is a UI prototype. Authentication is not connected yet.</p>
      </div>
    </div>
  </main>
